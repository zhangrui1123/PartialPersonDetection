# Baseline YOLOv10 pico (the adopted small model).
# P1 stem 8x240x320, P3/P4/P5 = 32/32/32. ~469k params, 1.79 MB FP32.
# Occupancy @ conf=0.03: recall 0.9267, FPR 45.2%.
channels: 1
nc: 1
scale: n
scales:
  n: [0.33, 0.10, 256]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2  8x240x320
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4  16x120x160
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]  # 3-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, SCDown, [512, 3, 2]]  # 5-P4/16
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, SCDown, [1024, 3, 2]]  # 7-P5/32
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 1, PSA, [1024]]  # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]  # 13
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]  # 16 P3/8
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]  # 19 P4/16
  - [-1, 1, SCDown, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 3, C2fCIB, [1024, True, True]]  # 22 P5/32
  - [[16, 19, 22], 1, v10Detect, [nc]]
