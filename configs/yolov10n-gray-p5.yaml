# Pico + stronger P5 only (keep v10Detect and P1/P3).
# P3/P4/P5 = 32/32/48, P5 C2f deepened. ~525k params, 2.004 MB FP32.
channels: 1
nc: 1
exact_width: true
scale: n
scales:
  n: [0.33, 1.0, 8192]

backbone:
  - [-1, 1, Conv, [8, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [16, 3, 2]]  # 1-P2/4
  - [-1, 3, C2f, [16, True]]
  - [-1, 1, Conv, [32, 3, 2]]  # 3-P3/8
  - [-1, 6, C2f, [32, True]]
  - [-1, 1, SCDown, [32, 3, 2]]  # 5-P4/16
  - [-1, 6, C2f, [32, True]]
  - [-1, 1, SCDown, [48, 3, 2]]  # 7-P5/32
  - [-1, 6, C2f, [48, True]]  # deeper P5 than pico
  - [-1, 1, SPPF, [48, 5]]
  - [-1, 1, PSA, [48]]  # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [32]]  # 13
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C2f, [32]]  # 16 P3/8
  - [-1, 1, Conv, [32, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 3, C2f, [32]]  # 19 P4/16
  - [-1, 1, SCDown, [32, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 3, C2fCIB, [48, True, True]]  # 22 P5/32
  - [[16, 19, 22], 1, v10Detect, [nc]]
