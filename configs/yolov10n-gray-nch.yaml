# YOLOv10 occupancy sized for NCH INT8 I/O ~ 800KB (42x120x160 = 787.5KB).
# Stride-4 stem (no P1 240x320). exact_width keeps 42/28/84/168 (not rounded to 8).
# Peak maps: 42x120x160 and 168x60x80 = 806400 B = 787.5KB.
channels: 1
nc: 1
exact_width: true
scale: n
scales:
  n: [0.33, 1.0, 8192]

backbone:
  - [-1, 1, Conv, [42, 3, 4]]  # 0-P2/4  42x120x160 = 787.5KB
  - [-1, 1, Conv, [42, 3, 1]]  # 1
  - [-1, 3, C2f, [28, True]]   # 2  concat 42x120x160
  - [-1, 1, Conv, [84, 3, 2]]  # 3-P3/8
  - [-1, 6, C2f, [84, True]]   # 4  n=2 concat 168x60x80 = 787.5KB
  - [-1, 1, SCDown, [84, 3, 2]]  # 5-P4/16
  - [-1, 6, C2f, [84, True]]
  - [-1, 1, SCDown, [168, 3, 2]]  # 7-P5/32
  - [-1, 3, C2f, [168, True]]
  - [-1, 1, SPPF, [168, 5]]
  - [-1, 1, PSA, [168]]  # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [84]]  # 13
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]  # 168x60x80 = 787.5KB
  - [-1, 3, C2f, [84]]  # 16 P3/8
  - [-1, 1, Conv, [84, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 3, C2f, [84]]  # 19 P4/16
  - [-1, 1, SCDown, [84, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 3, C2fCIB, [168, True, True]]  # 22 P5/32
  - [[16, 19, 22], 1, v10Detect, [nc]]
